name: PKM checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r standalone/requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm test
      - run: python scripts/audit_project.py
      - run: python standalone/build.py
      - run: node --check /tmp/pkm-standalone.mjs
      - run: python standalone/run_browser_checks.py
      - run: python scripts/package_release.py
      - run: git diff --exit-code -- dist downloads
