function parseCSV(text,separator=","){const rows=[];let row=[],cell='',quoted=false;text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===separator&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw Error('CSV indeholder et uafsluttet citat');row.push(cell);if(row.some(Boolean))rows.push(row);return rows;}

else $('#cards').innerHTML=banner+table(['KORT','SET','VERSIONER','EJET',''],slice.map(c=>`<tr><td><button class="table-card" data-card="${c.id}">${c.image?`<img src="${esc(c.image)}" alt="" loading="lazy">`:'<span class="mini-placeholder">♧</span>'}<span><b>${esc(c.name)}</b><small>#${esc(c.number)}</small></span></button></td><td>${esc(setOf(c).name)}</td><td><div class="version-chips">${versions(c).map(v=>`<button class="version-chip ${vqty(v)?'has-version':''}" data-quickversion="${v.id}">${esc(v.name)} <b>${vqty(v)}</b></button>`).join('')}</div></td><td>${qty(c)}</td><td><button data-addcard="${c.id}">+ Tilføj</button></td></tr>`));

function stockRows(){return db.holdings.map(h=>{const v=db.versions.find(v=>v.id===h.version_id),c=cardOf(v),s=setOf(c),l=locationOf(h);return {h,v,c,s,l};}).filter(({h,v,c,s,l})=>`${c.name} ${c.number}`.toLowerCase().includes(stockFilters.query.toLowerCase())&&(!stockFilters.set||s.id===Number(stockFilters.set))&&(!stockFilters.location||l.id===Number(stockFilters.location))&&(!stockFilters.version||v.name===stockFilters.version)&&(!stockFilters.condition||h.condition===stockFilters.condition)&&(!stockFilters.duplicates||vqty(v)>1)).sort((a,b)=>collator.compare(a.s.name,b.s.name)||collator.compare(a.c.number,b.c.number)||collator.compare(a.v.name,b.v.name)||collator.compare(a.l.name,b.l.name));}
function renderStock(){const rows=stockRows();$('#stockcount').textContent=`${rows.length} beholdningsposter · ${sum(rows,r=>r.h.quantity)} eksemplarer · ${new Set(rows.map(r=>r.c.id)).size} unikke kort i visningen`;
$('#stocktable').innerHTML=table(['KORT','SET','VERSION','STAND','ANTAL','LOKATION',''],rows.map(({h,v,c,s,l})=>`<tr><td><button class="table-card" data-card="${c.id}">${c.image?`<img src="${esc(c.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:'<span class="mini-placeholder">♧</span>'}<span><b>${esc(c.name)}</b><small>#${esc(c.number)}</small></span></button></td><td>${esc(s.name)}</td><td><span class="pill">${esc(v.name)}</span></td><td>${esc(h.condition)}</td><td class="quantitycell">${h.quantity}${vqty(v)>1?'<small class="muted">dubletversion</small>':''}</td><td>${esc(l.name)}</td><td><div class="rowactions"><button data-editholding="${h.id}" title="Redigér antal, stand og lokation">Redigér</button><button data-move="${h.id}">Flyt</button><button data-remove="${h.id}">Fjern</button></div></td></tr>`));}
function download(name,content,type='text/csv;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function csvCell(value){let s=String(value??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportStock(scope){let rows=stockRows();if(scope==='all')rows=db.holdings.map(h=>{const v=db.versions.find(v=>v.id===h.version_id),c=cardOf(v);return {h,v,c,s:setOf(c),l:locationOf(h)};});if(!rows.length){alert('Der er ingen beholdning at eksportere.');return;}
const lines=[['Set','Spil','År','Kortnummer','Kortnavn','Version','Stand','Antal','Lokation'],...rows.map(({h,v,c,s,l})=>[s.name,s.game,s.year,c.number,c.name,v.name,h.condition,h.quantity,l.name])];download(`PKM-lager-${scope==='all'?'alle':'filtreret'}-${new Date().toISOString().slice(0,10)}.csv`,'\uFEFF'+lines.map(r=>r.map(csvCell).join(';')).join('\r\n'));}
function quickHolding(v){if(!db.locations.length){modal('Opret en lokation først','<p>Vælg Lokationer og opret en kasse eller mappe til dine kort.</p>');return;}const c=cardOf(v);modal('Tilføj '+esc(c.name),`<p>#${esc(c.number)} · ${esc(v.name)} · ${esc(setOf(c).name)}</p>`+field('Antal','quantity','number','1')+'<label>Stand<select name="condition"><option>Near Mint</option><option>Excellent</option><option>Good</option><option>Played</option><option>Poor</option></select></label>'+select('Lokation','location_id',db.locations),p=>save('holdings',{...p,version_id:v.id}));}
const oldDetail=detail;
detail=function(id){oldDetail(id);const form=$('dialog form');const p=document.createElement('p');p.innerHTML=`<button type="button" data-editcard="${id}">Redigér kort og billede</button>`;form.insertBefore(p,form.querySelector('footer'));};
async function smallImage(file){if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type))throw Error('Vælg PNG, JPEG, WebP eller GIF');if(file.size>25e6)throw Error('Billedet er for stort (maks. 25 MB)');const url=URL.createObjectURL(file);try{const im=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Billedet kunne ikke læses'));i.src=url;});const ratio=Math.min(1,700/Math.max(im.width,im.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*ratio));canvas.height=Math.max(1,Math.round(im.height*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.85);}finally{URL.revokeObjectURL(url);}}
function editCard(c){$('#modal').close();modal('Redigér kort',select('Set','set_id',db.sets)+field('Kortnavn','name','text',c.name)+field('Kortnummer','number','text',c.number)+`<label>Billedadresse (valgfri)<input name="image" type="url" value="${esc(c.image.startsWith('http')?c.image:'')}"></label><label>Upload nyt billede<input name="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><label class="checkbox"><input name="clearimage" type="checkbox"> Fjern eksisterende billede</label><p class="footnote">Versioner og beholdning beholdes. Tom billedadresse beholder det eksisterende billede.</p>`,async p=>{let image=c.image;if(p.clearimage)image='';else if(p.file?.size)image=await smallImage(p.file);else if(p.image)image=p.image;await save('edit-card',{id:c.id,set_id:Number(p.set_id),name:p.name,number:p.number,image});});$('dialog select[name=set_id]').value=c.set_id;}
function editHolding(h){$('#modal').close();modal('Redigér beholdning',field('Antal','quantity','number',h.quantity)+`<label>Stand<select name="condition">${['Near Mint','Excellent','Good','Played','Poor'].map(s=>`<option>${s}</option>`).join('')}</select></label>`+select('Lokation','location_id',db.locations),p=>save('edit-holding',{...p,id:h.id}));$('dialog select[name=condition]').value=h.condition;$('dialog select[name=location_id]').value=h.location_id;}
async function previewImages(selectedFiles){const target=$('#imagepreview');try{const set=Number($('#imageset').value),files=[...selectedFiles].filter(f=>/^image\//.test(f.type));if(!set)throw Error('Vælg et set først');const cs=db.cards.filter(c=>c.set_id===set);const normalized=s=>String(s).trim().toLowerCase().replace(/^0+(?=\d)/,'');const used=new Set();const matches=files.map(file=>{const stem=file.name.replace(/\.[^.]+$/,''),found=cs.filter(c=>normalized(c.number)===normalized(stem));const card=found.length===1?found[0]:null;const duplicate=card&&used.has(card.id);if(card)used.add(card.id);return {file,card,valid:!!card&&!duplicate,status:found.length>1?'Tvetydigt kortnummer':!card?'Intet match':duplicate?'Dobbelt match':card.image?'Erstatter billede':'Klar'};});target.innerHTML=table(['FIL','KORT','STATUS'],matches.map(m=>`<tr><td>${esc(m.file.name)}</td><td>${m.card?esc(m.card.name)+' #'+esc(m.card.number):'—'}</td><td>${m.status}</td></tr>`));const valid=matches.filter(m=>m.valid);if(!valid.length)return;const b=document.createElement('button');b.className='primary';b.textContent=`Gem ${valid.length} matchede billeder`;target.append(b);b.onclick=async()=>{if(valid.some(m=>m.card.image)&&!confirm('Nogle kort har allerede billeder. Erstat billederne på de viste match?'))return;b.disabled=true;b.textContent='Behandler billeder…';try{const images=[];for(const m of valid)images.push({id:m.card.id,image:await smallImage(m.file)});await save('images',{images});target.innerHTML=`<p class="success">✓ ${images.length} billeder gemt. ${matches.length-images.length} filer blev ikke importeret.</p>`;}catch(e){alert(e.message);b.disabled=false;b.textContent='Prøv igen';}};}catch(e){target.textContent=e.message;}}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const keys=['owned','view','catalogpage','stockexport','clearstock','openlocation','wishlist','quickversion','editcard','editholding','setmissing','missing','csvtemplate'];const key=keys.find(k=>b.hasAttribute('data-'+k));if(!key)return;e.preventDefault();e.stopImmediatePropagation();try{
if(key==='owned'){catalogFilters.ownership=b.dataset.owned;catalogPage=1;render();}
if(key==='view'){catalogMode=b.dataset.view;render();}
if(key==='catalogpage'){catalogPage=Number(b.dataset.catalogpage);renderCards();$('#cards').scrollIntoView({behavior:'smooth',block:'start'});}
if(key==='stockexport')exportStock(b.dataset.stockexport);
if(key==='clearstock'){stockFilters={query:'',set:'',version:'',condition:'',location:'',duplicates:false};render();}
if(key==='openlocation'){stockFilters={query:'',set:'',version:'',condition:'',location:b.dataset.openlocation,duplicates:false};navigate('Lagerliste');}
if(key==='wishlist'){await save('wishlist',{id:Number(b.dataset.wishlist)});renderCards();}
if(key==='quickversion')quickHolding(db.versions.find(v=>v.id===Number(b.dataset.quickversion)));
if(key==='editcard')editCard(db.cards.find(c=>c.id===Number(b.dataset.editcard)));
if(key==='editholding')editHolding(db.holdings.find(h=>h.id===Number(b.dataset.editholding)));
if(key==='setmissing'||key==='missing'){catalogFilters={query:'',set:key==='setmissing'?b.dataset.setmissing:'',ownership:'missing',version:'',sort:'number'};catalogPage=1;navigate('Kortkatalog');}
if(key==='csvtemplate')download('PKM-kortskabelon.csv','number,name,image,versions\r\n001,Dit første kort,,Normal|Holo|Reverse Holo\r\n');
}catch(err){alert(err.message);}},true);

document.addEventListener('input',syncFilters);document.addEventListener('change',syncFilters);

function cmNormalize(raw,language){const text=String(raw||'').trim();let u;try{u=new URL(text);}catch{throw Error('Ugyldig Cardmarket-adresse');}if(text.length>2048||u.protocol!=='https:'||!['www.cardmarket.com','cardmarket.com'].includes(u.hostname)||u.username||u.password||u.port||!/^\/[a-z]{2}\/Pokemon\/Products\/Singles\/[^/]+\/[^/]+\/?$/.test(u.pathname))throw Error('Brug et HTTPS-link til en Cardmarket Pokémon-produktside');u.hostname='www.cardmarket.com';u.hash='';if(language==='ja'&&!u.searchParams.has('language'))u.searchParams.set('language','7');return u.href;}

let cmRows=[];
const cmRender=render;

const cmKey=s=>String(s||'').trim().normalize('NFC').toLowerCase();
async function cmPreview(e){const target=$('#cm-preview');target.innerHTML='';try{const file=e.target.files[0];if(!file)return;const text=await file.text(),first=text.replace(/^\uFEFF/,'').split(/\r?\n/)[0],sep=first.split(';').length>first.split(',').length?';':',',rows=parseCSV(text,sep),headers=rows.shift()?.map(cmKey);const required=['setkode','kortnummer','version','cardmarket_url'];if(!required.every(h=>headers?.includes(h))||new Set(headers).size!==headers.length)throw Error('CSV skal indeholde setkode, kortnummer, version og cardmarket_url én gang hver');cmRows=rows.filter(row=>row.some(cell=>cell.trim())).map((row,i)=>{const p=Object.fromEntries(headers.map((h,j)=>[h,row[j]||''])),result={line:i+2,p,valid:false};try{const sets=db.sets.filter(s=>cmKey(s.setCode||s.sourceId)===cmKey(p.setkode));if(sets.length!==1)throw Error(sets.length?'Setkoden er tvetydig':'Ukendt setkode');const cards=db.cards.filter(c=>c.set_id===sets[0].id&&normalizedNumber(c.number)===normalizedNumber(p.kortnummer));if(cards.length!==1)throw Error(cards.length?'Kortnummeret er tvetydigt':'Kortnummer findes ikke');const c=cards[0],vs=versions(c),matched=p.version.trim()?vs.filter(v=>cmKey(v.name)===cmKey(p.version)):vs.length===1?vs:[];if(matched.length!==1)throw Error('Version mangler eller findes ikke');result.v=matched[0];result.c=c;result.url=cmNormalize(p.cardmarket_url,sets[0].language);result.valid=true;result.status=cmExact(result.v)?'Eksisterende link — vælg erstatning':'Klar';}catch(err){result.status=err.message;}return result;});const counts=new Map();for(const r of cmRows)if(r.valid)counts.set(r.v.id,(counts.get(r.v.id)||0)+1);for(const r of cmRows)if(r.valid&&counts.get(r.v.id)>1){r.valid=false;r.status='Flere CSV-rækker matcher samme version';}const good=cmRows.filter(r=>r.valid);target.innerHTML=`<p><b>${good.length} matches</b> · ${cmRows.length-good.length} rækker med fejl springes over.</p>${table(['LINJE','KORT / VERSION','LINK','STATUS'],cmRows.map(r=>`<tr><td>${r.line}</td><td>${esc(r.p.setkode)}-${esc(r.p.kortnummer)}<br>${esc(r.p.version||'—')}</td><td class="cm-url">${r.valid?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Kontrollér produktside ↗</a>`:esc(r.p.cardmarket_url)}</td><td>${esc(r.status)}</td></tr>`))}<label class="checkbox"><input type="checkbox" id="cm-replace"> Erstat eksisterende links på de matchede versioner</label><p id="cm-count"></p><div id="cm-error" class="error" role="alert"></div><button class="primary" id="cm-save">Gem links</button>`;decorateTables();const selected=()=>good.filter(r=>$('#cm-replace').checked||!r.v.cardmarketUrl);const update=()=>{const n=selected().length;$('#cm-count').textContent=`${n} links gemmes · ${good.length-n} eksisterende links bevares.`;$('#cm-save').disabled=!n;};$('#cm-replace').onchange=update;update();$('#cm-save').onclick=async()=>{const b=$('#cm-save');b.disabled=true;b.textContent='Gemmer…';try{const chosen=selected();await save('cardmarket-links',{links:chosen.map(r=>({version_id:r.v.id,url:r.url}))});target.innerHTML=`<p class="success" role="status">${chosen.length} Cardmarket-links gemt. ${cmRows.length-chosen.length} rækker blev ikke importeret.</p>`;}catch(err){$('#cm-error').textContent=err.message;b.textContent='Prøv igen';b.disabled=false;}};}catch(err){target.innerHTML=`<p class="error" role="alert">${esc(err.message)}</p>`;}}

// Validate imported files before any destructive replacement.
function validateCollectionData(d){
 if(!d||!['sets','cards','versions','locations','holdings'].every(k=>Array.isArray(d[k])&&d[k].every(x=>x&&Number.isSafeInteger(x.id)&&x.id>0)&&new Set(d[k].map(x=>x.id)).size===d[k].length))throw Error('Ugyldige poster i samlingsfilen');
 if(d.cards.some(c=>typeof c.image!=='string'||c.image&&!/^https?:\/\//.test(c.image)&&!/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=\s]+$/.test(c.image)))throw Error('Ugyldigt eller usikkert billede i samlingsfilen');
 if(d.sets.some(s=>typeof s.name!=='string')||d.locations.some(l=>typeof l.name!=='string')||d.cards.some(c=>typeof c.name!=='string'||typeof c.number!=='string'||!d.sets.some(s=>s.id===c.set_id))||d.versions.some(v=>typeof v.name!=='string'||!d.cards.some(c=>c.id===v.card_id))||d.holdings.some(h=>!Number.isSafeInteger(h.quantity)||h.quantity<1||typeof h.condition!=='string'||!d.versions.some(v=>v.id===h.version_id)||!d.locations.some(l=>l.id===h.location_id)))throw Error('Ugyldige kort eller beholdning');
 for(const v of d.versions){if(!v.cardmarketUrl)continue;let u;try{u=new URL(v.cardmarketUrl);}catch{throw Error('Ugyldigt Cardmarket-link');}if(u.protocol!=='https:'||!['www.cardmarket.com','cardmarket.com'].includes(u.hostname)||u.username||u.password||u.port||!/^\/[a-z]{2}\/Pokemon\/Products\/Singles\/[^/]+\/[^/]+\/?$/.test(u.pathname))throw Error('Usikkert Cardmarket-link');}
}

recoveryButton.onclick=async()=>{try{const snapshot=await readPersistedState('recovery');if(!snapshot)throw Error('Ingen gendannelseskopi endnu. Den oprettes, når du åbner en samlingsfil.');validateCollectionData(snapshot.data);if(!confirm('Gendan samlingen fra '+new Date(snapshot.savedAt).toLocaleString('da-DK')+'? Den nuværende samling gemmes som næste gendannelseskopi.'))return;await persist(snapshot.data,{backupBeforeReplace:true});db=snapshot.data;render();toast('Samling gendannet');}catch(err){alert(err.message);}};

if(d.sets.some(s=>typeof s.name!=='string')||d.locations.some(l=>typeof l.name!=='string')||d.cards.some(c=>typeof c.name!=='string'||typeof c.number!=='string'||typeof c.image!=='string'||!d.sets.some(s=>s.id===c.set_id))||d.versions.some(v=>typeof v.name!=='string'||!d.cards.some(c=>c.id===v.card_id))||d.holdings.some(h=>!Number.isSafeInteger(h.quantity)||h.quantity<1||typeof h.condition!=='string'||!d.versions.some(v=>v.id===h.version_id)||!d.locations.some(l=>l.id===h.location_id)))throw Error('Backup indeholder ugyldige poster');
validateCollectionData(d);if(!confirm('Erstat den nuværende samling med denne backup? Gem først en backup af dine nuværende data.'))return;await persist(d,{backupBeforeReplace:true});db=d;render();alert('Backup indlæst');}catch(err){alert(err.message);}finally{e.target.value='';}};
